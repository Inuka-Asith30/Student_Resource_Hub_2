<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Note | Student Notes Management System</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 CSS (loaded first so our own style.css can override it) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-layout">

    <!-- ---------------- SIDEBAR (Bootstrap navbar, vertical) ---------------- -->
    <nav class="navbar navbar-dark sidebar flex-column">
      <a class="navbar-brand d-flex align-items-center gap-2" href="dashboard.html">
        <img src="images/logo.png" alt="Logo" class="nav-logo" />
        <span>Campus<br />Portal</span>
      </a>

      <ul class="navbar-nav flex-column w-100">
        <li class="nav-item"><a class="nav-link" href="dashboard.html">🏠 Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="pastpapers.html">📄 Notes</a></li>
        <li class="nav-item upload-nav-item" style="display: none;"><a class="nav-link active" aria-current="page" href="upload.html">⬆️ Upload Notes</a></li>
        <li class="nav-item"><a class="nav-link" href="index.html">🔑 Login</a></li>
        <li class="nav-item"><a class="nav-link" href="register.html">📝 Register</a></li>
      </ul>

      <div class="sidebar-logout" style="display: none;">
        <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#logoutModal">🚪 Logout</a>
      </div>
    </nav>

    <!-- ---------------- MAIN CONTENT ---------------- -->
    <main class="main-content">

      <div class="topbar">
        <h1>Upload Note</h1>
      </div>

      <div class="card upload-card border-0">

        <!--
          UPLOAD FORM
          id="uploadForm" lets script.js listen for the "submit" event,
          stop the page from reloading, validate the fields, and show a
          Bootstrap success modal instead of actually saving a file
          anywhere — this is a front-end demo only.
        -->
        <form id="uploadForm" novalidate>

          <!-- Subject name field -->
          <div class="form-group">
            <label for="subjectName" class="form-label">Subject Name</label>
            <input
              type="text"
              id="subjectName"
              name="subjectName"
              class="form-control"
              placeholder="e.g. Physics"
              required
            />
          </div>

          <!-- Year field -->
          <div class="form-group">
            <label for="NoteYear" class="form-label">Year</label>
            <input
              type="number"
              id="NoteYear"
              name="NoteYear"
              class="form-control"
              placeholder="e.g. 2024"
              min="2000"
              max="2100"
              required
            />
          </div>

          <!-- File upload field -->
          <div class="form-group">
            <label for="NoteFile" class="form-label">Upload File (PDF)</label>
            <input
              type="file"
              id="NoteFile"
              name="NoteFile"
              class="form-control"
              accept=".pdf"
              required
            />
          </div>

          <button type="submit" class="btn btn-primary">Upload Note</button>
        </form>

      </div>

    </main>
  </div>

  <!-- ======================================================
       BOOTSTRAP MODAL: Upload success
       Shown by script.js after the form passes validation
       (replaces the old inline success message box).
  ======================================================= -->
  <div class="modal fade" id="uploadSuccessModal" tabindex="-1" aria-labelledby="uploadSuccessLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body text-center py-4">
          <div class="display-6 mb-2">✅</div>
          <h5 class="mb-1" id="uploadSuccessLabel">Upload Successful</h5>
          <p class="text-muted mb-0">Your Note was uploaded successfully!</p>
        </div>
        <div class="modal-footer justify-content-center border-0 pt-0">
          <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Done</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ======================================================
       BOOTSTRAP MODAL: Logout confirmation
  ======================================================= -->
  <div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledby="logoutModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="logoutModalLabel">Confirm Logout</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          Are you sure you want to log out of Campus Portal?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <a href="index.html" class="btn btn-danger">🚪 Logout</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS bundle (includes Popper, needed for modal) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
