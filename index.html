<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Student Past Paper Management System</title>

  <!-- Google Font: Poppins (required font for the whole project) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 CSS (loaded first so our own style.css can override it) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

  <!-- Shared stylesheet used by every page -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ======================================================
       LOGIN PAGE
       Bootstrap: .card component + a Bootstrap .modal for
       "Forgot password?"
  ======================================================= -->
  <div class="login-page">

    <div class="card login-card border-0">

      <!-- University logo placeholder (a simple circle with initials) -->
      <div class="logo-placeholder">LOGO</div>

      <h1>Campus Portal</h1>
      <p class="subtitle">Student Past Paper Management System</p>

      <!--
        The form uses action="dashboard.html" so that clicking "Login"
        simply takes the user to the dashboard page.
        No real authentication happens here since this is a static
        front-end only project with no database.
      -->
      <form action="dashboard.html" method="get">

        <!-- Student email field -->
        <div class="form-group">
          <label for="email" class="form-label">Student Email</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            placeholder="e.g. student@campus.edu"
            required
          />
        </div>

        <!-- Password field -->
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="Enter your password"
            required
          />
        </div>

        <!-- Submitting the form redirects to the dashboard page -->
        <button type="submit" class="btn btn-primary">Login</button>
      </form>

      <!-- Bootstrap modal trigger -->
      <p class="mt-3 mb-0">
        <a href="#" class="small" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">Forgot password?</a>
      </p>

      <p class="login-footer">© 2026 Campus Portal — For student use only</p>
    </div>

  </div>

  <!-- ======================================================
       BOOTSTRAP MODAL: Forgot Password
  ======================================================= -->
  <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-labelledby="forgotPasswordLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="forgotPasswordLabel">Reset Password</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted small">Enter your student email and we'll send you a reset link. (Demo only — no email is actually sent.)</p>
          <input type="email" class="form-control" placeholder="e.g. student@campus.edu" />
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Send Reset Link</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS bundle (includes Popper, needed for modal/dropdown/carousel) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
